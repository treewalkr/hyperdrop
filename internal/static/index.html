<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperDrop — Send Files</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📤</text></svg>">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    /* ========================================
       RESET & AURORA THEME
       ======================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080b1a;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.14);
      --text: #e8e8f8;
      --text-muted: #7878a0;
      --accent: #7c6cf0;
      --accent-secondary: #4ecdc4;
      --accent-glow: rgba(124,108,240,0.2);
      --accent2-glow: rgba(78,205,196,0.15);
      --success: #4ecdc4;
      --danger: #ff6b6b;
      --warning: #ffd93d;
      --radius: 16px;
      --radius-sm: 12px;
      --header-h: 56px;
      --gradient-accent: linear-gradient(135deg, #7c6cf0, #4ecdc4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ========================================
       ANIMATED AURORA BACKGROUND
       ======================================== */
    .aurora-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      will-change: transform, opacity;
    }

    .aurora-blob.blob-1 {
      width: 600px; height: 600px;
      background: rgba(124,108,240,0.15);
      top: -10%; left: -5%;
      animation: aurora-drift-1 18s ease-in-out infinite;
    }

    .aurora-blob.blob-2 {
      width: 500px; height: 500px;
      background: rgba(78,205,196,0.10);
      top: 40%; right: -8%;
      animation: aurora-drift-2 22s ease-in-out infinite;
    }

    .aurora-blob.blob-3 {
      width: 450px; height: 450px;
      background: rgba(200,100,255,0.10);
      bottom: -5%; left: 30%;
      animation: aurora-drift-3 20s ease-in-out infinite;
    }

    .aurora-blob.blob-4 {
      width: 350px; height: 350px;
      background: rgba(124,108,240,0.08);
      top: 20%; left: 50%;
      animation: aurora-drift-4 25s ease-in-out infinite;
    }

    @keyframes aurora-drift-1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.7; }
      33% { transform: translate(80px, 60px) scale(1.15); opacity: 1; }
      66% { transform: translate(-40px, 120px) scale(0.9); opacity: 0.8; }
    }

    @keyframes aurora-drift-2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
      33% { transform: translate(-100px, -40px) scale(1.2); opacity: 0.9; }
      66% { transform: translate(50px, -80px) scale(0.95); opacity: 0.7; }
    }

    @keyframes aurora-drift-3 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      33% { transform: translate(60px, -50px) scale(1.1); opacity: 0.85; }
      66% { transform: translate(-80px, 30px) scale(0.9); opacity: 0.6; }
    }

    @keyframes aurora-drift-4 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
      50% { transform: translate(-70px, 90px) scale(1.25); opacity: 0.7; }
    }

    /* ========================================
       GLASS MIXIN
       ======================================== */
    .glass {
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
    }

    /* ========================================
       HEADER
       ======================================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      height: var(--header-h);
      background: rgba(8,11,26,0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .app-header .brand {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-nav a {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .header-nav a:hover {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border-hover);
    }

    .header-nav a.active {
      color: var(--accent);
      border-color: rgba(124,108,240,0.3);
      background: var(--accent-glow);
      box-shadow: 0 0 20px rgba(124,108,240,0.1);
    }

    .header-nav a svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
    }

    /* ========================================
       BODY DRAG-OVER STATE
       ======================================== */
    body.drag-active::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(124,108,240,0.06);
      border: 2px dashed rgba(124,108,240,0.4);
      z-index: 50;
      pointer-events: none;
      animation: aurora-pulse-border 1.5s ease infinite;
    }

    body.drag-active .aurora-blob {
      filter: blur(80px);
      opacity: 1.4;
    }

    @keyframes aurora-pulse-border {
      0%, 100% { border-color: rgba(124,108,240,0.4); }
      50% { border-color: rgba(78,205,196,0.3); }
    }

    /* ========================================
       SEND STAGE — NEBULA (CENTERED CIRCLE)
       ======================================== */
    .send-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--header-h));
      padding: 2rem;
      gap: 2.5rem;
      position: relative;
      z-index: 1;
    }

    .send-stage .intro { text-align: center; }

    .send-stage .intro h2 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .send-stage .intro p {
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }

    .send-stage .intro .target-hint {
      margin-top: 0.35rem;
      font-size: 0.82rem;
      color: var(--accent);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    /* Nebula dropzone — circular portal with rotating conic ring + glow */
    .nebula-dropzone {
      position: relative;
      width: 260px;
      height: 260px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .nebula-dropzone:hover { transform: scale(1.03); }
    .nebula-dropzone.dragover { transform: scale(1.06); }

    .nebula-dropzone .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px dashed rgba(124,108,240,0.3);
      animation: ring-rotate 20s linear infinite;
    }

    .nebula-dropzone .ring::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(124,108,240,0.4), transparent 30%, rgba(78,205,196,0.3) 60%, transparent 90%);
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 2px));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 2px));
      animation: ring-rotate 12s linear infinite reverse;
    }

    @keyframes ring-rotate {
      to { transform: rotate(360deg); }
    }

    .nebula-dropzone .inner {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.3s ease;
    }

    .nebula-dropzone:hover .inner,
    .nebula-dropzone.dragover .inner {
      background: rgba(124,108,240,0.08);
      border-color: rgba(124,108,240,0.2);
      box-shadow: 0 0 40px rgba(124,108,240,0.15), inset 0 0 40px rgba(124,108,240,0.05);
    }

    .nebula-dropzone .glow {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,108,240,0.12) 0%, transparent 70%);
      animation: glow-pulse 3s ease-in-out infinite;
      pointer-events: none;
    }

    .nebula-dropzone.dragover .glow {
      background: radial-gradient(circle, rgba(124,108,240,0.25) 0%, transparent 70%);
    }

    @keyframes glow-pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .nebula-dropzone svg {
      width: 44px; height: 44px;
      stroke: var(--text-muted);
      fill: none;
      transition: stroke 0.3s;
    }

    .nebula-dropzone:hover svg,
    .nebula-dropzone.dragover svg {
      stroke: var(--accent);
    }

    /* Constrain + center so the label never spills past the circle's curve,
       even when it wraps on the small (200px) mobile dropzone. */
    .nebula-dropzone .label {
      color: var(--text-muted);
      font-size: 0.9rem;
      max-width: 78%;
      text-align: center;
      line-height: 1.3;
    }
    .nebula-dropzone .browse {
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 600;
    }

    .file-list {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .empty-hint {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 1rem 0;
      opacity: 0.6;
    }

    /* ========================================
       FILE CARD — GLASS STYLE
       ======================================== */
    .file-card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      transition: all 0.25s ease;
    }

    .file-card:hover {
      background: rgba(255,255,255,0.06);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 16px rgba(124,108,240,0.06);
    }

    .file-card.state-error {
      border-color: rgba(255,107,107,0.25);
      background: rgba(255,107,107,0.04);
    }

    .file-card .file-icon {
      width: 38px; height: 38px; min-width: 38px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      flex-shrink: 0;
      overflow: hidden;
    }

    .file-icon.doc  { background: rgba(124,108,240,0.18); color: #7c6cf0; }
    .file-icon.img  { background: rgba(78,205,196,0.18); color: #4ecdc4; }
    .file-icon.vid  { background: rgba(255,107,107,0.18); color: #ff6b6b; }
    .file-icon.zip  { background: rgba(255,217,61,0.18); color: #ffd93d; }
    .file-icon.file { background: rgba(120,120,160,0.15); color: #7878a0; }

    .file-card .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-card .file-name,
    .folder-head .file-name {
      font-size: 0.88rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .file-card .file-meta,
    .folder-head .file-meta {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 3px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .file-meta .speed { color: var(--accent); font-weight: 500; }
    .file-meta .done-label { color: var(--success); font-weight: 500; }
    .file-meta .error-label { color: var(--danger); font-weight: 500; }
    .file-meta .paused-label { color: var(--warning); font-weight: 500; }

    .file-card .progress-bar,
    .folder-head .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 4px;
      margin-top: 6px;
      overflow: hidden;
    }

    .file-card .progress-bar .fill,
    .folder-head .progress-bar .fill {
      height: 100%;
      border-radius: 4px;
      width: 0%;
      transition: width 0.15s ease;
      background: var(--gradient-accent);
      box-shadow: 0 0 8px rgba(124,108,240,0.3);
    }

    .fill.done {
      background: var(--success);
      box-shadow: 0 0 8px rgba(78,205,196,0.3);
    }
    .fill.error {
      background: var(--danger);
      box-shadow: 0 0 8px rgba(255,107,107,0.3);
    }
    .fill.paused {
      background: var(--warning);
      box-shadow: 0 0 8px rgba(255,217,61,0.3);
    }

    /* --- Actions --- */
    .file-card .actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      flex-wrap: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .file-card:hover .actions {
      opacity: 1;
    }

    @media (hover: none) {
      .file-card .actions { opacity: 1 !important; }
    }

    .act-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.35rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .act-btn:hover {
      background: rgba(255,255,255,0.06);
      color: var(--text);
    }
    .act-btn.danger:hover {
      color: var(--danger);
      background: rgba(255,107,107,0.1);
    }
    .act-btn svg { width: 16px; height: 16px; }

    .folder-card {
      border: 1px solid var(--glass-border, rgba(255,255,255,0.08));
      border-radius: 14px;
      background: var(--glass, rgba(255,255,255,0.04));
      margin-bottom: 0.75rem;
      overflow: hidden;
    }
    .folder-head {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      cursor: pointer;
      user-select: none;
    }
    .folder-chevron { width: 18px; height: 18px; color: var(--text-muted); transition: transform 0.15s ease; transform: rotate(0deg); flex-shrink: 0; }
    .folder-chevron svg { width: 18px; height: 18px; }
    .folder-chevron.open { transform: rotate(90deg); }
    .folder-icon { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: rgba(124,108,240,0.18); color: #7c6cf0; flex-shrink: 0; }
    .folder-icon svg { width: 20px; height: 20px; }
    .folder-head .file-info { flex: 1; min-width: 0; }
    .folder-head .actions { opacity: 0.6; }
    .folder-head:hover .actions { opacity: 1; }

    .folder-children { padding: 0 0.5rem 0.5rem 2.6rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .file-card.child {
      background: transparent;
      border: none;
      padding: 0.4rem 0.5rem;
      margin-bottom: 0;
      box-shadow: none;
    }
    .file-card.child .file-icon { width: 30px; height: 30px; font-size: 0.65rem; }
    .file-card.child .file-name { font-size: 0.85rem; }
    .progress-bar.slim { height: 4px; }

    .cancelled-label { color: var(--text-muted); }
    @media (max-width: 640px) { .folder-head .actions { opacity: 1; } }


    /* ========================================
       TOAST — GLASS SLIDE-IN
       ======================================== */
    .toast-container {
      position: fixed;
      top: calc(var(--header-h) + 1rem);
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 9999;
      pointer-events: none;
    }

    .toast {
      background: rgba(20,20,40,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      color: var(--text);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 16px rgba(124,108,240,0.06);
      pointer-events: auto;
      max-width: 340px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toast.success { border-left: 3px solid var(--success); }
    .toast.error   { border-left: 3px solid var(--danger); }
    .toast.info    { border-left: 3px solid var(--accent); }

    /* ========================================
       CONFIRM MODAL — GLASS FADE
       ======================================== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8,11,26,0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
      animation: aurora-modal-in 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes aurora-modal-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .modal-box {
      background: rgba(20,20,40,0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 24px rgba(124,108,240,0.06);
      animation: aurora-modal-box-in 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes aurora-modal-box-in {
      from { opacity: 0; transform: scale(0.92) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-box h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
    .modal-box p  { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.25rem; line-height: 1.5; }
    .modal-box .fname { color: var(--text); font-weight: 500; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .modal-actions button {
      padding: 0.5rem 1.1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-actions button:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
    }

    .modal-actions .btn-danger {
      background: rgba(255,107,107,0.15);
      border-color: rgba(255,107,107,0.3);
      color: var(--danger);
    }

    .modal-actions .btn-danger:hover {
      background: rgba(255,107,107,0.25);
      border-color: rgba(255,107,107,0.5);
    }

    /* ========================================
       RESPONSIVE
       ======================================== */
    @media (max-width: 768px) {
      .nebula-dropzone {
        width: 200px;
        height: 200px;
      }

      .app-header { padding: 0 1rem; }
      .toast-container { right: 1rem; left: 1rem; }
      .toast { max-width: 100%; }
    }

    /* ========================================
       SCROLLBAR
       ======================================== */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.14);
    }

    [x-cloak] { display: none !important; }
  </style>
</head>
<body x-data="sendPage()"
      :class="{ 'drag-active': dragging }"
      @dragenter.window.prevent="dragEnter()"
      @dragleave.window.prevent="dragLeave()"
      @dragover.window.prevent
      @drop.window.prevent="bodyDrop()"
      @keydown.escape.window="confirmCancel()">

  <!-- AURORA BACKGROUND -->
  <div class="aurora-bg" aria-hidden="true">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
    <div class="aurora-blob blob-4"></div>
  </div>

  <!-- HEADER -->
  <header class="app-header">
    <a href="/" class="brand">HyperDrop</a>
    <nav class="header-nav">
      <a href="/" class="active" data-testid="nav-send" title="Upload files" aria-label="Send files">

  <script>
    function sendPage() {
      const DOC_EXTS = ['pdf','doc','docx','txt','md','xls','xlsx','csv','ppt','pptx','rtf','fig'];
      const IMG_EXTS = ['png','jpg','jpeg','gif','svg','webp','bmp','ico'];
      const VID_EXTS = ['mp4','mov','avi','mkv','webm','flv','wmv'];
      const ZIP_EXTS = ['zip','rar','7z','tar','gz','bz2','xz'];

      return {
        files: [],
        folders: [],           // directory-upload group cards: { id, name, expanded }
        nextId: 0,
        nextFolderId: 0,
        dragging: false,
        dragCount: 0,
        dzOver: false,
        currentPath: '',       // active sub-directory for uploads ('' = root)
        token: '',
        toasts: [],
        nextToastId: 0,
        confirmOpen: false,
        confirmTitle: '',
        confirmBody: '',
        confirmOkLabel: 'Remove',
        _confirmResolve: null,
        ws: null,                  // live WebSocket for server-reported progress
        wsReconnectDelay: 500,     // backoff seed, doubled per failed reconnect
        // Folder uploads are queued with a small concurrency cap so dropping a
        // thousand-file folder doesn't fire a thousand parallel POSTs.
        _folderPending: [],
        _folderActive: 0,
        FOLDER_CONCURRENCY: 4,

        init() {
          // NOTE: Alpine v3 auto-invokes a component's init() method, so the
          // <body> tag uses x-data only — no x-init. Adding x-init="init()"
          // here would run this twice, opening two WebSockets and processing
          // every event twice (the upload-progress instability in issue #15).
          const params = new URLSearchParams(location.search);
          this.token = params.get('token') || '';
          this.currentPath = (params.get('path') || '').replace(/^\/+|\/+$/g, '');
          // The server sets the hyperdrop_session cookie on the token-bearing
          // page request; from here on the cookie — not the URL — is the
          // credential. Drop ?token from the address bar so it doesn't linger
          // in browser history or leak via Referer. this.token stays in memory
          // so API calls keep working until the cookie round-trips.
          // NOTE: history.replaceState is not exercised by the Go HTTP tests;
          // manually verified, regression coverage pending E2E (#20/#21).
          this.stripTokenFromURL();
          // Subscribe to server-reported upload progress (issue #15). The bar
          // is driven by bytes the server writes to disk, not by how much the
          // browser has buffered on the socket — the latter never moves on a
          // fast LAN/localhost link.
          this.connectWS();
        },

        // Open the real-time event stream. Mirrors the Files page: reconnects
        // with exponential backoff so a dropped socket recovers without a page
        // reload. Only upload_progress is consumed here; completion is handled
        // authoritatively by xhr.onload (and the terminal file_uploaded it
        // corresponds to).
        connectWS() {
          const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
          const url = proto + '//' + location.host + '/api/ws' + this.qs;
          let ws;
          try {
            ws = new WebSocket(url);
          } catch (e) {
            this.scheduleReconnect();
            return;
          }
          this.ws = ws;
          this.wsReconnectDelay = 500;

          ws.onmessage = (ev) => {
            let data;
            try { data = JSON.parse(ev.data); } catch (e) { return; }
            if (data.type === 'upload_progress') this.onUploadProgress(data);
            else if (data.type === 'file_uploaded') this.onUploadComplete(data);
          };
          ws.onclose = () => { this.ws = null; this.scheduleReconnect(); };
          ws.onerror = () => { try { ws.close(); } catch (e) {} };
        },

        scheduleReconnect() {
          const delay = this.wsReconnectDelay;
          this.wsReconnectDelay = Math.min(delay * 2, 16000);
          setTimeout(() => this.connectWS(), delay);
        },

        // Server-reported bytes for an in-flight file. Authoritative over the
        // client-only xhr.upload.onprogress signal (which rarely fires on fast
        // links). The denominator is the file's known size (f.size), NOT the
        // server's total: r.ContentLength is unavailable for chunked uploads
        // and is the whole-request size for multi-file uploads, so the server's
        // total is only a hint. Completion is driven by onUploadComplete
        // (file_uploaded), so this only advances the bar mid-transfer.
        onUploadProgress(data) {
          // Match on the full relative path when present (folder uploads) so two
          // files sharing a basename in different subfolders don't collide. The
          // server reports name = the full multipart filename (relPath).
          const f = this.files.find((x) => {
            if (x.status !== 'uploading') return false;
            return (x.relPath || x.name) === data.name;
          });
          if (!f || !f.size) return;
          if (data.bytesWritten > 0) {
            // Monotonic: only ever move the bar forward. Out-of-order or
            // repeated progress events (and the xhr.upload.onprogress fallback)
            // must not drag an already-higher percentage back down.
            const pct = Math.min(100, Math.round((data.bytesWritten / f.size) * 100));
            f.progress = Math.max(f.progress, pct);
            const elapsed = (Date.now() - f.startedAt) / 1000;
            f.speed = elapsed > 0 ? (data.bytesWritten / 1048576 / elapsed).toFixed(1) : '0.0';
          }
        },

        // Authoritative completion for one upload. The server-reported
        // file_uploaded event (onUploadComplete) is the primary signal;
        // xhr.onload's 2xx branch (in upload()) is the fallback for when the
        // socket is down. Both route here so the card finalizes exactly once
        // regardless of which fires first.
        //
        // The entry is re-resolved from this.files by id rather than trusting
        // the caller's reference: xhr.onload closes over the *raw* object that
        // was pushed, but Alpine's reactivity lives on the proxy stored in
        // this.files. Mutating the raw target bypasses the proxy's set trap, so
        // the data changes but the DOM never re-renders (the card would freeze
        // on "uploading" while the toast still fired). Looking the proxy up
        // here keeps every mutation reactive and gives both callers one shared
        // _finalizing guard so the second signal can't re-schedule or
        // double-toast.
        //
        // The bar is pinned at 100% and held for a short beat before flipping
        // to "Complete": a fast upload (small file / localhost) finishes within
        // a single frame, so without the hold the card would jump 0% → done and
        // the progress fill (animated by the CSS width transition) would never
        // be seen — the bar would just flicker.
        finalizeUpload(entry) {
          if (!entry) return;
          const f = this.files.find((x) => x.id === entry.id);
          if (!f || f.status !== 'uploading' || f._finalizing) return;
          f._finalizing = true;
          f.progress = 100;
          const elapsed = Date.now() - (f.startedAt || Date.now());
          const minVisible = 350;
          const done = () => {
            // Bail if the card was cancelled/dismissed during the hold.
            if (!this.files.includes(f) || f.status !== 'uploading') return;
            f.status = 'done';
            f.speed = 0;
            this.toast(f.name + ' uploaded', 'success');
          };
          if (elapsed >= minVisible) done();
          else setTimeout(done, minVisible - elapsed);
        },

        // Server-reported completion: the file_uploaded event fires the instant
        // the server finishes writing the file, so this is the authoritative
        // signal to finalize the card. Delegates to finalizeUpload so the
        // minVisible hold and double-completion guard are shared with the
        // xhr.onload fallback.
        onUploadComplete(data) {
          const file = data.file || {};
          const f = this.files.find((x) => x.name === file.name && x.status === 'uploading');
          if (f) this.finalizeUpload(f);
        },

        // Remove ?token from the address bar without disturbing other params.
        stripTokenFromURL() {
          try {
            const u = new URL(location.href);
            if (!u.searchParams.has('token')) return;
            u.searchParams.delete('token');
            history.replaceState(null, '', u.pathname + u.search + u.hash);
          } catch (e) { /* non-secure context or no history API */ }
        },

        // Query string carrying token + path so uploads land in the right subdir.
        get qs() {
          const p = new URLSearchParams();
          if (this.token) p.set('token', this.token);
          if (this.currentPath) p.set('path', this.currentPath);
          const s = p.toString();
          return s ? ('?' + s) : '';
        },

        // Resolve a name relative to the current upload directory.
        fullPath(name) {
          return this.currentPath ? (this.currentPath + '/' + name) : name;
        },

        encPath(name) {
          return this.fullPath(name).split('/').map(encodeURIComponent).join('/');
        },

        // Human label for the active target directory.
        get targetHint() {
          return this.currentPath ? ('Uploading to ' + this.currentPath) : '';
        },

        extOf(name) {
          const parts = String(name).split('.');
          return parts.length > 1 ? parts.pop().toLowerCase() : '';
        },

        categoryOf(ext) {
          if (DOC_EXTS.includes(ext)) return 'doc';
          if (IMG_EXTS.includes(ext)) return 'img';
          if (VID_EXTS.includes(ext)) return 'vid';
          if (ZIP_EXTS.includes(ext)) return 'zip';
          return 'file';
        },

        formatSize(bytes) {
          if (bytes < 1024) return bytes + ' B';
          if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
          if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
          return (bytes / 1073741824).toFixed(2) + ' GB';
        },

        // ---- intake ----
        // Build one upload entry. relPath is the '/'-separated path INCLUDING
        // the top folder (e.g. "vacation/sub/a.txt"); it becomes the multipart
        // filename so the server nests the file under currentPath. folderId ties
        // the entry to its aggregate folder card (null for loose files).
        makeEntry(file, relPath, folderId) {
          const ext = this.extOf(file.name);
          return {
            id: ++this.nextId,
            file,
            name: file.name,
            relPath: relPath || '',
            folderId: folderId || null,
            size: file.size,
            ext,
            category: this.categoryOf(ext),
            progress: 0,
            status: 'uploading',
            speed: 0,
            xhr: null,
            startedAt: Date.now(),
          };
        },

        addFiles(list) {
          for (const file of list) {
            const entry = this.makeEntry(file, '', null);
            this.files.push(entry);
            this.upload(entry);
          }
          const n = list.length;
          this.toast(n + ' file' + (n > 1 ? 's' : '') + ' added', 'info');
        },

        // Ingest a collected folder as [{file, rel}] — rel is the '/'-separated
        // path INCLUDING the top folder ("vacation/sub/a.txt"). Creates one
        // aggregate folder card and queues uploads (concurrency-capped).
        // Drag-and-drop walks its dropped directory into this same shape; tests
        // call it directly since a headless browser can't synthesize a folder drag.
        intakeFolderEntries(items, folderName) {
          if (!items || !items.length) return;
          const folderId = 'f' + (++this.nextFolderId);
          const name = folderName || (items[0].rel ? items[0].rel.split('/')[0] : 'Folder');
          const entries = items.map((it) => this.makeEntry(it.file, it.rel || it.file.name, folderId));
          this.folders.push({ id: folderId, name, expanded: true });
          for (const e of entries) this.files.push(e);
          for (const e of entries) this.enqueueFolderUpload(e);
          this.toast(name + ' · ' + entries.length + ' files queued', 'info');
        },

        onFilePick(e) {
          if (e.target.files && e.target.files.length) this.addFiles(e.target.files);
          e.target.value = '';
        },

        // Drag-and-drop: a dropped directory is walked via webkitGetAsEntry into
        // [{file, rel}] and funneled through intakeFolderEntries (shared with the
        // programmatic path). Plain files, or browsers without the entries API,
        // fall back to flat addFiles. The dropzone's "browse" click is files-only
        // (a single native dialog can't pick files-or-folder), so folders arrive
        // exclusively through drag-and-drop.
        async addDroppedItems(dataTransfer) {
          const items = dataTransfer.items;
          if (!items || !items.length || !items[0].webkitGetAsEntry) {
            this.addFiles(dataTransfer.files);
            return;
          }
          // Snapshot entries synchronously: the DataTransferItemList is
          // invalidated once the drop handler returns.
          const top = [];
          for (let i = 0; i < items.length; i++) {
            const entry = items[i].webkitGetAsEntry && items[i].webkitGetAsEntry();
            if (entry) top.push(entry);
          }
          if (!top.some((e) => e.isDirectory)) { this.addFiles(dataTransfer.files); return; }

          const collected = [];
          let folderName = '';
          const walk = (entry, rel) => new Promise((resolve) => {
            if (entry.isFile) {
              entry.file(
                (file) => {
                  if (!folderName && rel) folderName = rel.split('/')[0];
                  collected.push({ file, rel: rel || file.name });
                  resolve();
                },
                () => resolve(),
              );
            } else if (entry.isDirectory) {
              const reader = entry.createReader();
              const readBatch = () => new Promise((res) => reader.readEntries(res, () => res([])));
              // readEntries returns at most ~100 entries per call; loop until empty.
              (async () => {
                let batch;
                do {
                  batch = await readBatch();
                  for (const child of batch) {
                    await walk(child, rel ? (rel + '/' + child.name) : child.name);
                  }
                } while (batch && batch.length);
                resolve();
              })();
            } else {
              resolve();
            }
          });
          try {
            for (const entry of top) await walk(entry, entry.name);
          } catch (err) {
            this.toast('folder scan failed', 'error');
            return;
          }
          if (collected.length) this.intakeFolderEntries(collected, folderName);
        },

        // ---- folder upload queue (concurrency cap) ----
        enqueueFolderUpload(entry) {
          this._folderPending.push(entry);
          this.pumpFolderUploads();
        },

        pumpFolderUploads() {
          while (this._folderActive < this.FOLDER_CONCURRENCY && this._folderPending.length) {
            const entry = this._folderPending.shift();
            this._folderActive++;
            this.upload(entry, () => {
              this._folderActive--;
              this.pumpFolderUploads();
            });
          }
        },

        // ---- upload (real backend, XHR for progress + cancel) ----
        // onDone fires once the request settles (success/error/abort) so the
        // folder queue can release its slot and pump the next file.
        upload(entry, onDone) {
          const fd = new FormData();
          // The third arg is the multipart filename. For folder entries it is
          // the full relative path, which the server nests under currentPath.
          fd.append('file', entry.file, entry.relPath || entry.file.name);

          const xhr = new XMLHttpRequest();
          entry.xhr = xhr;
          entry.startedAt = Date.now();

          // Secondary signal only (issue #15): measures bytes the browser has
          // handed to the socket, which on a fast LAN/localhost link leaves the
          // buffer almost instantly and so rarely fires mid-upload. Server-
          // reported progress via WebSocket (onUploadProgress) is authoritative;
          // this never moves the bar backward, only forward as a fallback.
          xhr.upload.onprogress = (e) => {
            if (!e.lengthComputable) return;
            const pct = Math.round((e.loaded / e.total) * 100);
            entry.progress = Math.max(entry.progress, pct);
            const elapsed = (Date.now() - entry.startedAt) / 1000;
            entry.speed = elapsed > 0 ? (e.loaded / 1048576 / elapsed).toFixed(1) : '0.0';
          };
          xhr.onload = () => {
            entry.xhr = null;
            if (onDone) onDone();
            if (xhr.status >= 200 && xhr.status < 300) {
              // Fallback completion path: finalizeUpload is shared with the
              // authoritative file_uploaded handler over the WS. Whichever
              // fires first owns the (held) 100% → done transition; the other
              // is a no-op via the _finalizing guard, so there's no double
              // toast. On a fast link this typically fires before the WS event.
              this.finalizeUpload(entry);
            } else {
              entry.status = 'error';
              this.toast(entry.name + ' failed (' + xhr.status + ')', 'error');
            }
          };
          xhr.onerror = () => {
            entry.xhr = null;
            if (onDone) onDone();
            entry.status = 'error';
            this.toast(entry.name + ' failed', 'error');
          };
          xhr.onabort = () => { entry.xhr = null; if (onDone) onDone(); };

          // location.search carries ?token= + ?path= on first load; the auth
          // cookie covers later calls and qs pins the target subdirectory.
          xhr.open('POST', '/api/upload' + this.qs);
          xhr.send(fd);
        },

        pauseUpload(id) {
          const f = this.files.find((x) => x.id === id);
          if (!f || f.status !== 'uploading') return;
          if (f.xhr) { f.xhr.abort(); f.xhr = null; }
          f.status = 'paused';
          this.toast(f.name + ' paused', 'info');
        },

        resumeUpload(id) {
          const f = this.files.find((x) => x.id === id);
          if (!f || (f.status !== 'paused' && f.status !== 'error')) return;
          // Single-shot multipart upload has no native resume — restart from 0%.
          f.status = 'uploading';
          f.progress = 0;
          f.speed = 0;
          this.upload(f);
          this.toast(f.name + ' resumed', 'info');
        },

        retryUpload(id) { this.resumeUpload(id); },

        async cancelUpload(id) {
          const f = this.files.find((x) => x.id === id);
          if (!f) return;
          const ok = await this.confirm(
            'Cancel upload?',
            'Cancel upload of <span class="fname">' + this.escape(f.name) + '</span>?'
          );
          if (!ok) return;
          if (f.xhr) { f.xhr.abort(); f.xhr = null; }
          this.files = this.files.filter((x) => x.id !== id);
          this.toast(f.name + ' cancelled', 'info');
        },

        dismissFile(id) {
          this.files = this.files.filter((x) => x.id !== id);
        },

        async removeFile(id) {
          const f = this.files.find((x) => x.id === id);
          if (!f) return;
          const ok = await this.confirm(
            'Delete file?',
            'Delete <span class="fname">' + this.escape(f.name) + '</span> from the server? This cannot be undone.',
            'Delete'
          );
          if (!ok) return;
          if (f.xhr) { f.xhr.abort(); f.xhr = null; }
          try {
            const resp = await fetch('/api/files/' + this.encPath(f.name) + this.qs, { method: 'DELETE' });
            if (resp.ok) {
              this.files = this.files.filter((x) => x.id !== id);
              this.toast(f.name + ' deleted', 'success');
            } else {
              this.toast('delete failed (' + resp.status + ')', 'error');
            }
          } catch (err) {
            this.toast('delete failed', 'error');
          }
        },

        downloadFile(id) {
          const f = this.files.find((x) => x.id === id);
          if (!f) return;
          window.open('/api/files/' + this.encPath(f.name) + this.qs, '_blank');
        },

        copyLink(id) {
          const f = this.files.find((x) => x.id === id);
          if (!f) return;
          const link = location.origin + '/api/files/' + this.encPath(f.name) + this.qs;
          // navigator.clipboard is undefined on non-secure (http:// LAN) contexts,
          // which is the primary deployment target — fall back to a prompt so the
          // user can still copy, and never toast success when nothing was written.
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(link).then(
              () => this.toast('Link copied', 'success'),
              () => this.fallbackCopy(link),
            );
          } else {
            this.fallbackCopy(link);
          }
        },

        fallbackCopy(link) {
          window.prompt('Copy link:', link);
        },

        // ---- folder grouping & aggregate progress ----
        looseFiles() {
          return this.files.filter((f) => !f.folderId);
        },

        filesIn(folderId) {
          return this.files.filter((f) => f.folderId === folderId);
        },

        // Byte-weighted aggregate progress for a folder card. Weighting by size
        // (not file count) means a 500MB video moves the bar more than a 2KB
        // text file, matching what users expect to see climb.
        folderProgress(fld) {
          const kids = this.filesIn(fld.id);
          let total = 0, done = 0, doneCount = 0;
          for (const f of kids) {
            total += f.size;
            done += f.size * Math.min(100, f.progress) / 100;
            if (f.status === 'done') doneCount++;
          }
          const pct = total ? Math.round((done / total) * 100) : 0;
          return { pct, total, count: kids.length, doneCount };
        },

        // Derived folder status from its children's states.
        folderStatus(fld) {
          const kids = this.filesIn(fld.id);
          if (!kids.length) return 'done';
          if (kids.some((f) => f.status === 'uploading')) return 'uploading';
          if (kids.every((f) => f.status === 'done')) return 'done';
          if (kids.some((f) => f.status === 'error')) return 'error';
          return 'cancelled';
        },

        async cancelFolder(folderId) {
          const fld = this.folders.find((f) => f.id === folderId);
          if (!fld) return;
          const ok = await this.confirm(
            'Cancel folder upload?',
            'Cancel upload of <span class="fname">' + this.escape(fld.name) + '</span>? ' +
              'Files already uploaded will remain on the server.'
          );
          if (!ok) return;
          // Abort in-flight children and drop the pending queue entries; the
          // settle callbacks will pump the queue, but removed entries are gone.
          const kids = this.filesIn(folderId);
          for (const f of kids) {
            if (f.xhr) { try { f.xhr.abort(); } catch (e) {} }
          }
          this._folderPending = this._folderPending.filter((e) => e.folderId !== folderId);
          this.files = this.files.filter((f) => f.folderId !== folderId);
          this.folders = this.folders.filter((f) => f.id !== folderId);
          this.toast(fld.name + ' cancelled', 'info');
        },

        // Remove a finished folder card and its (completed) child rows.
        dismissFolder(folderId) {
          this.files = this.files.filter((f) => f.folderId !== folderId);
          this.folders = this.folders.filter((f) => f.id !== folderId);
        },

        // ---- drag & drop ----
        dragEnter() { this.dragCount++; this.dragging = true; },
        dragLeave() { this.dragCount--; if (this.dragCount <= 0) { this.dragCount = 0; this.dragging = false; } },
        bodyDrop(e) {
          this.dragCount = 0; this.dragging = false; this.dzOver = false;
          if (e && e.dataTransfer) this.addDroppedItems(e.dataTransfer);
        },
        dropFiles(e) {
          this.dzOver = false;
          if (e.dataTransfer) this.addDroppedItems(e.dataTransfer);
        },

        // ---- toast ----
        toast(msg, type) {
          const id = ++this.nextToastId;
          this.toasts.push({ id, msg, type: type || 'info' });
          setTimeout(() => {
            this.toasts = this.toasts.filter((t) => t.id !== id);
          }, 2500);
        },

        // ---- confirm modal ----
        confirm(title, body, okLabel) {
          return new Promise((resolve) => {
            this.confirmTitle = title;
            this.confirmBody = body;
            this.confirmOkLabel = okLabel || 'Remove';
            this.confirmOpen = true;
            this._confirmResolve = resolve;
          });
        },
        confirmOk() {
          this.confirmOpen = false;
          if (this._confirmResolve) { this._confirmResolve(true); this._confirmResolve = null; }
        },
        confirmCancel() {
          this.confirmOpen = false;
          if (this._confirmResolve) { this._confirmResolve(false); this._confirmResolve = null; }
        },

        // ---- helpers ----
        escape(s) {
          return String(s).replace(/[&<>"']/g, (c) => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
          ));
        },
      };
    }
  </script>
</body>
</html>
