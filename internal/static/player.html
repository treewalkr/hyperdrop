<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperDrop — Player</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080b1a;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.14);
      --text: #e8e8f8;
      --text-muted: #7878a0;
      --accent: #7c6cf0;
      --accent-secondary: #4ecdc4;
      --accent-glow: rgba(124,108,240,0.2);
      --danger: #ff6b6b;
      --radius: 16px;
      --radius-sm: 12px;
      --header-h: 56px;
      --gradient-accent: linear-gradient(135deg, #7c6cf0, #4ecdc4);
      --modal-backdrop: rgba(8,11,26,0.70);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    button, .btn { cursor: pointer; font-family: inherit; }

    .mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace; }

    /* AURORA BACKGROUND */
    .aurora-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .aurora-blob { position: absolute; border-radius: 50%; filter: blur(120px); will-change: transform, opacity; }
    .aurora-blob.blob-1 { width: 600px; height: 600px; background: rgba(124,108,240,0.15); top: -10%; left: -5%; animation: aurora-drift-1 18s ease-in-out infinite; }
    .aurora-blob.blob-2 { width: 500px; height: 500px; background: rgba(78,205,196,0.10); top: 40%; right: -8%; animation: aurora-drift-2 22s ease-in-out infinite; }
    .aurora-blob.blob-3 { width: 450px; height: 450px; background: rgba(255,107,107,0.10); bottom: -5%; left: 30%; animation: aurora-drift-3 20s ease-in-out infinite; }
    @keyframes aurora-drift-1 { 0%,100%{transform:translate(0,0) scale(1);opacity:.7} 33%{transform:translate(80px,60px) scale(1.15);opacity:1} 66%{transform:translate(-40px,120px) scale(.9);opacity:.8} }
    @keyframes aurora-drift-2 { 0%,100%{transform:translate(0,0) scale(1);opacity:.6} 33%{transform:translate(-100px,-40px) scale(1.2);opacity:.9} 66%{transform:translate(50px,-80px) scale(.95);opacity:.7} }
    @keyframes aurora-drift-3 { 0%,100%{transform:translate(0,0) scale(1);opacity:.5} 33%{transform:translate(60px,-50px) scale(1.1);opacity:.85} 66%{transform:translate(-80px,30px) scale(.9);opacity:.6} }

    /* HEADER */
    .app-header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0 1.5rem; height: var(--header-h);
      background: rgba(8,11,26,0.7);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .app-header .brand {
      font-size: 1.2rem; font-weight: 800; letter-spacing: -0.03em;
      background: var(--gradient-accent);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      text-decoration: none; flex-shrink: 0;
    }
    .header-nav { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .header-nav a {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.4rem 0.85rem; border-radius: var(--radius-sm);
      font-size: 0.85rem; font-weight: 500; color: var(--text-muted);
      text-decoration: none; border: 1px solid transparent; transition: all 0.2s ease;
    }
    .header-nav a:hover { color: var(--text); background: var(--surface-hover); border-color: var(--border-hover); }
    .header-nav a.active { color: var(--accent); border-color: rgba(124,108,240,0.3); background: var(--accent-glow); }
    .header-nav a svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }
    .toolbar-spacer { flex: 1; }

    .back-link {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.4rem 0.85rem; border-radius: var(--radius-sm);
      font-size: 0.85rem; font-weight: 500; color: var(--text-muted);
      text-decoration: none; border: 1px solid var(--border); transition: all 0.2s ease;
    }
    .back-link:hover { color: var(--text); background: var(--surface-hover); border-color: var(--border-hover); }
    .back-link svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }

    /* PLAYER SURFACE */
    main {
      position: relative; z-index: 1;
      max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem;
    }
    .player-card {
      background: var(--surface);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .player-video {
      display: block; width: 100%; max-height: 72vh;
      background: #000;
    }
    .player-meta {
      display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
    }
    .player-title { font-weight: 600; font-size: 1rem; word-break: break-all; }
    .player-time { color: var(--text-muted); font-size: 0.8rem; }
    .player-actions { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 0.9rem; border-radius: var(--radius-sm);
      font-size: 0.85rem; font-weight: 600; text-decoration: none;
      color: var(--text); background: var(--surface-hover);
      border: 1px solid var(--border-hover); transition: all 0.2s ease;
    }
    .btn:hover { background: var(--surface); border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--gradient-accent); color: #fff; border-color: transparent; }
    .btn.primary:hover { color: #fff; filter: brightness(1.08); }
    .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }

    /* EMPTY / FALLBACK STATE */
    .state {
      position: relative; z-index: 1;
      max-width: 560px; margin: 12vh auto 0; padding: 2.5rem 2rem; text-align: center;
      background: var(--surface);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: var(--radius);
    }
    .state .icon {
      width: 56px; height: 56px; margin: 0 auto 1rem;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: rgba(255,107,107,0.18); color: var(--danger);
    }
    .state .icon svg { width: 28px; height: 28px; stroke: currentColor; fill: none; }
    .state h2 { font-size: 1.1rem; margin-bottom: 0.4rem; }
    .state p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.25rem; word-break: break-all; }
    .state .fname { color: var(--text); font-weight: 600; }

    [x-cloak] { display: none !important; }
  </style>
</head>
<body x-data="playerPage()" x-init="init()">

  <div class="aurora-bg" aria-hidden="true">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
  </div>

  <header class="app-header">
    <a href="/" class="brand">HyperDrop</a>
    <nav class="header-nav">
      <a href="/" data-testid="nav-send" title="Upload files" aria-label="Send files">
        <svg stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
        <span>Send</span>
      </a>
      <a href="/files" data-testid="nav-files" title="Manage files" aria-label="Browse files">
        <svg stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
        <span>Files</span>
      </a>
    </nav>
    <div class="toolbar-spacer"></div>
    <a class="back-link" data-testid="back-files" :href="'/files' + qs">
      <svg stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      <span>Back to Files</span>
    </a>
  </header>

  <!-- PLAYABLE -->
  <main x-show="state === 'play'" x-cloak>
    <div class="player-card">
      <video class="player-video" controls playsinline preload="metadata"
             data-testid="video"
             :src="'/api/stream/' + encPath + qs"
             @error="onVideoError()"></video>
      <div class="player-meta">
        <span class="player-title" data-testid="player-title" x-text="baseName"></span>
        <span class="player-time mono" x-text="metaText" data-testid="player-meta"></span>
        <div class="player-actions">
          <a class="btn primary" data-testid="download"
             :href="'/api/files/' + encPath + qs" download
             :aria-label="'Download ' + baseName" title="Download">
            <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            Download
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- UNSUPPORTED / MISSING -->
  <section class="state" x-show="state !== 'play'" x-cloak data-testid="player-fallback">
    <div class="icon">
      <svg stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
    </div>
    <h2 x-text="stateTitle"></h2>
    <p x-html="stateBody"></p>
    <a class="btn primary" data-testid="download"
       x-show="state === 'unsupported'"
       :href="'/api/files/' + encPath + qs" download
       :aria-label="'Download ' + baseName">Download anyway</a>
    <a class="btn" :href="'/files' + qs">Back to Files</a>
  </section>

  <script>
    // Natively <video>-decodable containers. Mirrors server.playable().
    const PLAYABLE = ['.mp4', '.m4v', '.webm', '.ogv', '.mov'];

    function playerPage() {
      return {
        file: '',        // decoded relative path from ?file=
        token: '',
        state: 'play',   // 'play' | 'unsupported' | 'missing'
        size: 0,
        type: '',

        init() {
          const params = new URLSearchParams(location.search);
          this.file = (params.get('file') || '').replace(/^\/+/, '');
          this.token = params.get('token') || '';

          // No file or non-playable codec → download fallback.
          if (!this.file || !this.isPlayable(this.file)) {
            this.state = this.file ? 'unsupported' : 'missing';
          }

          if (this.state === 'play') this.probe();
          this.stripTokenFromURL();
        },

        get encPath() {
          return this.file.split('/').map(encodeURIComponent).join('/');
        },
        get baseName() { return this.file.split('/').filter(Boolean).pop() || this.file; },
        get qs() {
          const p = new URLSearchParams();
          if (this.token) p.set('token', this.token);
          const s = p.toString();
          return s ? ('?' + s) : '';
        },
        get stateTitle() {
          return this.state === 'missing' ? 'No file specified' : "Can't play in-browser";
        },
        get stateBody() {
          if (this.state === 'missing') return 'Open a video from the Files page to play it here.';
          return 'This format (<span class="fname mono">' + this.ext + '</span>) isn\'t decodable by the browser. Download it to watch.';
        },
        get ext() {
          const i = this.file.lastIndexOf('.');
          return i >= 0 ? this.file.slice(i) : '';
        },
        get metaText() {
          const parts = [];
          if (this.size) parts.push(this.formatSize(this.size));
          if (this.type) parts.push(this.type);
          return parts.join(' · ');
        },

        isPlayable(name) {
          const i = name.lastIndexOf('.');
          if (i < 0) return false;
          return PLAYABLE.includes(name.slice(i).toLowerCase());
        },

        // HEAD the stream endpoint to confirm the file exists and read its
        // size/type for the metadata strip. A 404 flips to the missing state.
        async probe() {
          try {
            const resp = await fetch('/api/stream/' + this.encPath + this.qs, { method: 'HEAD' });
            if (resp.status === 404) { this.state = 'missing'; return; }
            this.size = Number(resp.headers.get('Content-Length')) || 0;
            this.type = resp.headers.get('Content-Type') || '';
          } catch (e) { /* non-fatal; metadata only */ }
        },

        // The <video> failed to load (e.g. a .mov on a browser without the
        // codec, or the file vanished mid-session). Fall back to download.
        onVideoError() { this.state = 'unsupported'; },

        stripTokenFromURL() {
          try {
            const u = new URL(location.href);
            if (!u.searchParams.has('token')) return;
            u.searchParams.delete('token');
            history.replaceState(null, '', u.pathname + u.search + u.hash);
          } catch (e) { /* non-secure context */ }
        },

        formatSize(bytes) {
          if (!bytes) return '';
          if (bytes < 1024) return bytes + ' B';
          if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
          if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
          return (bytes / 1073741824).toFixed(2) + ' GB';
        },
      };
    }
  </script>
</body>
</html>
