<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperDrop — Files</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📂</text></svg>">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    /* ========================================
       RESET & AURORA THEME
       ======================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080b1a;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.08);
      --surface-active: rgba(255,255,255,0.12);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.14);
      --text: #e8e8f8;
      --text-muted: #7878a0;
      --accent: #7c6cf0;
      --accent-secondary: #4ecdc4;
      --accent-glow: rgba(124,108,240,0.2);
      --accent2-glow: rgba(78,205,196,0.15);
      --success: #4ecdc4;
      --danger: #ff6b6b;
      --warning: #ffd93d;
      --radius: 16px;
      --radius-sm: 12px;
      --header-h: 56px;
      /* Combined height of the stacked sticky bars (header + breadcrumb).
         Header is fixed at --header-h; the breadcrumb bar is one line of
         crumbs with 0.6rem vertical padding + a 1px bottom border. Measured
         at 43px in-browser (0.6rem*2 ~= 19.2px + ~13.6px*1.5 line ~= 20.4px
         + 1px border + rounding). Drives scroll-padding-top so anchor/
         programmatic scroll lands below the sticky stack and the first item
         is never clipped on scroll-to-top or in-page navigation (issue #18). */
      --breadcrumb-h: 43px;
      --sticky-stack-h: calc(var(--header-h) + var(--breadcrumb-h));
      --gradient-accent: linear-gradient(135deg, #7c6cf0, #4ecdc4);
    }

    /* Anchor/programmatic scroll lands below the stacked sticky header +
       breadcrumb bar in every variant, so the first item is never clipped
       on scroll-to-top or in-page navigation (issue #18). */
    html { scroll-padding-top: var(--sticky-stack-h); }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    button { cursor: pointer; font-family: inherit; }

    /* ========================================
       ANIMATED AURORA BACKGROUND
       ======================================== */
    .aurora-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      will-change: transform, opacity;
    }

    .aurora-blob.blob-1 {
      width: 600px; height: 600px;
      background: rgba(124,108,240,0.15);
      top: -10%; left: -5%;
      animation: aurora-drift-1 18s ease-in-out infinite;
    }

    .aurora-blob.blob-2 {
      width: 500px; height: 500px;
      background: rgba(78,205,196,0.10);
      top: 40%; right: -8%;
      animation: aurora-drift-2 22s ease-in-out infinite;
    }

    .aurora-blob.blob-3 {
      width: 450px; height: 450px;
      background: rgba(200,100,255,0.10);
      bottom: -5%; left: 30%;
      animation: aurora-drift-3 20s ease-in-out infinite;
    }

    .aurora-blob.blob-4 {
      width: 350px; height: 350px;
      background: rgba(124,108,240,0.08);
      top: 20%; left: 50%;
      animation: aurora-drift-4 25s ease-in-out infinite;
    }

    @keyframes aurora-drift-1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.7; }
      33% { transform: translate(80px, 60px) scale(1.15); opacity: 1; }
      66% { transform: translate(-40px, 120px) scale(0.9); opacity: 0.8; }
    }

    @keyframes aurora-drift-2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
      33% { transform: translate(-100px, -40px) scale(1.2); opacity: 0.9; }
      66% { transform: translate(50px, -80px) scale(0.95); opacity: 0.7; }
    }

    @keyframes aurora-drift-3 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      33% { transform: translate(60px, -50px) scale(1.1); opacity: 0.85; }
      66% { transform: translate(-80px, 30px) scale(0.9); opacity: 0.6; }
    }

    @keyframes aurora-drift-4 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
      50% { transform: translate(-70px, 90px) scale(1.25); opacity: 0.7; }
    }

    /* ========================================
       HEADER
       ======================================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1.5rem;
      height: var(--header-h);
      background: rgba(8,11,26,0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .app-header .brand {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
      flex-shrink: 0;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .header-nav a {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .header-nav a:hover {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border-hover);
    }

    .header-nav a.active {
      color: var(--accent);
      border-color: rgba(124,108,240,0.3);
      background: var(--accent-glow);
      box-shadow: 0 0 20px rgba(124,108,240,0.1);
    }

    .header-nav a svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
    }

    .toolbar-spacer { flex: 1; }

    /* ========================================
       BREADCRUMB TRAIL
       ======================================== */
    .breadcrumb-bar {
      position: sticky;
      top: var(--header-h);
      z-index: 90;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      flex-wrap: wrap;
      padding: 0.6rem 1.5rem;
      background: rgba(8,11,26,0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .crumb {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.25rem 0.45rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .crumb:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .crumb.current {
      color: var(--accent);
      cursor: default;
    }
    .crumb.current:hover { background: none; }

    .crumb-sep {
      color: var(--text-muted);
      opacity: 0.5;
      font-size: 0.75rem;
      user-select: none;
    }

    .crumb svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
    }

    /* Folder names are clickable navigation entry points. */
    .is-folder {
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }
    .is-folder:hover { opacity: 0.75; }

    /* Sort pills — glass background, active gradient */
    .sort-pills {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .sort-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      transition: all 0.25s ease;
      white-space: nowrap;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .sort-pill:hover {
      color: var(--text);
      border-color: var(--border-hover);
      background: var(--surface-hover);
    }

    .sort-pill.active {
      color: #fff;
      border-color: rgba(124,108,240,0.4);
      background: var(--gradient-accent);
      box-shadow: 0 0 16px rgba(124,108,240,0.2);
    }

    /* Search box — glass effect */
    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.4rem 0.85rem;
      gap: 0.5rem;
      width: 220px;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .search-box:focus-within {
      border-color: rgba(124,108,240,0.4);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 0 20px rgba(124,108,240,0.1);
    }

    .search-box input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.82rem;
      width: 100%;
    }

    .search-box input::placeholder { color: var(--text-muted); }

    .search-box svg {
      width: 14px; height: 14px;
      stroke: var(--text-muted);
      fill: none;
      flex-shrink: 0;
    }

    .stat {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    /* Batch action bar — appears when files are selected */
    .batch-bar {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .batch-count {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid rgba(124,108,240,0.3);
      border-radius: 999px;
      padding: 0.2rem 0.55rem;
    }

    .batch-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.3rem 0.6rem;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s ease;
    }

    .batch-btn:hover { background: var(--surface-hover); border-color: var(--border-hover); }
    .batch-btn.danger:hover { color: var(--danger); border-color: rgba(255,107,107,0.3); background: rgba(255,107,107,0.08); }
    .batch-btn svg { width: 14px; height: 14px; }

    /* ========================================
       FILE TYPE BADGE
       ======================================== */
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      border-radius: 6px;
      padding: 2px 6px;
      flex-shrink: 0;
      min-width: 34px;
    }
    .badge.doc  { background: rgba(124,108,240,0.2); color: #7c6cf0; }
    .badge.img  { background: rgba(78,205,196,0.2); color: #4ecdc4; }
    .badge.vid  { background: rgba(255,107,107,0.2); color: #ff6b6b; }
    .badge.zip  { background: rgba(255,217,61,0.2); color: #ffd93d; }
    .badge.file { background: rgba(120,120,160,0.15); color: #7878a0; }

    /* ========================================
       ACTION BUTTONS
       ======================================== */
    .act-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 0.35rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .act-btn:hover {
      background: rgba(255,255,255,0.06);
      color: var(--text);
    }
    .act-btn.danger:hover {
      color: var(--danger);
      background: rgba(255,107,107,0.1);
    }
    .act-btn svg { width: 16px; height: 16px; }

    /* ========================================
       CHECKBOX
       ======================================== */
    .cb {
      width: 16px; height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ========================================
       VARIANT A — TABLE (GLASS)
       ======================================== */
    .variant-a {
      /* Bounded height + overflow:auto makes this the scroll container for the
         table. That keeps the thead sticky relative to THIS box (pinned to its
         top via thead th { top: 0 }), so the header sits just below the
         breadcrumb and the first row is never painted under it (issue #18).
         overflow:auto also preserves horizontal scroll for wide tables. */
      height: calc(100vh - var(--sticky-stack-h));
      overflow: auto;
      position: relative;
      z-index: 1;
    }

    .variant-a table { width: 100%; border-collapse: collapse; min-width: 640px; }

    .variant-a thead th {
      padding: 0.7rem 1.25rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      position: sticky;
      /* Pin to the top of the .variant-a scroll container (which sits just
         below the breadcrumb bar), not the viewport. With the old
         top: var(--header-h) the thead rode up over the first data row on
         scroll (issue #18). */
      top: 0;
      background: rgba(8,11,26,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 2;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .variant-a tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: all 0.2s ease;
    }

    .variant-a tbody tr:hover {
      background: rgba(255,255,255,0.04);
      box-shadow: 0 0 20px rgba(124,108,240,0.03);
    }

    .variant-a tbody tr.selected {
      background: rgba(124,108,240,0.08);
      box-shadow: inset 0 0 0 1px rgba(124,108,240,0.15);
    }

    .variant-a td {
      padding: 0.65rem 1.25rem;
      font-size: 0.88rem;
      vertical-align: middle;
    }

    .variant-a .col-name {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }

    .variant-a .col-name .fname {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .variant-a td.size,
    .variant-a td.date { color: var(--text-muted); font-size: 0.82rem; }

    .variant-a td.from { color: var(--text-muted); font-size: 0.82rem; }

    .from-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--success);
      margin-right: 5px;
      box-shadow: 0 0 6px rgba(78,205,196,0.4);
    }

    .variant-a td.row-actions { opacity: 0; transition: opacity 0.2s ease; display: flex; gap: 0.25rem; justify-content: flex-end; }
    .variant-a tbody tr:hover td.row-actions { opacity: 1; }

    .variant-a .empty-row td {
      text-align: center;
      padding: 4rem 1.5rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* ========================================
       VARIANT B — GRID (GLASS CARDS)
       ======================================== */
    .variant-b {
      padding: 1.25rem;
      min-height: calc(100vh - var(--header-h));
      position: relative;
      z-index: 1;
    }

    .variant-b .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.85rem;
    }

    .variant-b .file-card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: all 0.3s ease;
      position: relative;
    }

    .variant-b .file-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.3), 0 0 20px rgba(124,108,240,0.06);
    }

    .variant-b .file-card.selected {
      border-color: rgba(124,108,240,0.4);
      background: rgba(124,108,240,0.06);
      box-shadow: 0 0 24px rgba(124,108,240,0.1);
    }

    .variant-b .file-card .preview {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 700;
      text-transform: uppercase;
      position: relative;
    }

    .preview.doc  { background: rgba(124,108,240,0.06); color: #7c6cf0; }
    .preview.img  { background: rgba(78,205,196,0.06); color: #4ecdc4; }
    .preview.vid  { background: rgba(255,107,107,0.06); color: #ff6b6b; }
    .preview.zip  { background: rgba(255,217,61,0.06); color: #ffd93d; }
    .preview.file { background: rgba(120,120,160,0.06); color: #7878a0; }

    .preview .from-tag {
      position: absolute;
      top: 6px; right: 6px;
      font-size: 0.6rem;
      background: rgba(8,11,26,0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.06);
      font-weight: 500;
      color: var(--text-muted);
    }

    .preview .cb-wrap {
      position: absolute;
      top: 6px; left: 6px;
    }

    .preview .cb-wrap .cb { width: 18px; height: 18px; }

    .variant-b .file-card .card-actions {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      background: rgba(8,11,26,0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .variant-b .file-card:hover .card-actions { opacity: 1; }

    .variant-b .file-card .card-actions button {
      flex: 1;
      background: none;
      border: none;
      color: var(--text);
      padding: 0.45rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .variant-b .file-card .card-actions button:hover { background: rgba(255,255,255,0.08); }
    .variant-b .file-card .card-actions button.danger:hover { color: var(--danger); }
    .variant-b .file-card .card-actions button svg { width: 14px; height: 14px; }

    .variant-b .file-card .card-body { padding: 0.7rem 0.8rem; }

    .variant-b .file-card .card-body .fname {
      font-size: 0.82rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .variant-b .file-card .card-body .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.3rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    .variant-b .empty-grid {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }

    /* ========================================
       VARIANT C — FEED (GLASS TIMELINE)
       ======================================== */
    .variant-c {
      max-width: 660px;
      margin: 0 auto;
      padding: 1.25rem;
      min-height: calc(100vh - var(--header-h));
      position: relative;
      z-index: 1;
    }

    .variant-c .date-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.5rem 0 0.85rem;
    }

    .variant-c .date-divider::before,
    .variant-c .date-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .variant-c .date-divider span {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .variant-c .feed-item {
      display: flex;
      gap: 0.85rem;
      padding: 0.85rem;
      border-radius: var(--radius);
      transition: all 0.25s ease;
    }

    .variant-c .feed-item:hover {
      background: rgba(255,255,255,0.03);
    }

    .variant-c .feed-item .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .variant-c .feed-item .feed-body { flex: 1; min-width: 0; }

    .variant-c .feed-item .feed-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.45rem;
    }

    .variant-c .feed-item .sender { font-size: 0.85rem; font-weight: 600; }
    .variant-c .feed-item .feed-time {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    .variant-c .feed-item .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.7rem;
      max-width: 100%;
      transition: all 0.25s ease;
    }

    .variant-c .feed-item:hover .file-chip {
      border-color: var(--border-hover);
      background: rgba(255,255,255,0.05);
    }

    .variant-c .feed-item .file-chip .chip-icon {
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      width: 28px; height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chip-icon.doc  { background: rgba(124,108,240,0.2); color: #7c6cf0; }
    .chip-icon.img  { background: rgba(78,205,196,0.2); color: #4ecdc4; }
    .chip-icon.vid  { background: rgba(255,107,107,0.2); color: #ff6b6b; }
    .chip-icon.zip  { background: rgba(255,217,61,0.2); color: #ffd93d; }
    .chip-icon.file { background: rgba(120,120,160,0.15); color: #7878a0; }

    .variant-c .feed-item .file-chip .chip-info { min-width: 0; }

    .variant-c .feed-item .file-chip .chip-name {
      font-size: 0.82rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .variant-c .feed-item .file-chip .chip-meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    .variant-c .feed-item .feed-actions {
      display: flex;
      gap: 0.25rem;
      align-self: center;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .variant-c .feed-item:hover .feed-actions { opacity: 1; }

    .variant-c .empty-feed {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }

    /* ========================================
       TOAST — GLASS SLIDE-IN
       ======================================== */
    .toast-container {
      position: fixed;
      top: calc(var(--header-h) + 1rem);
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 9999;
      pointer-events: none;
    }

    .toast {
      background: rgba(20,20,40,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      color: var(--text);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 16px rgba(124,108,240,0.06);
      pointer-events: auto;
      max-width: 340px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toast.success { border-left: 3px solid var(--success); }
    .toast.error   { border-left: 3px solid var(--danger); }
    .toast.info    { border-left: 3px solid var(--accent); }

    /* ========================================
       CONFIRM MODAL — GLASS FADE
       ======================================== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8,11,26,0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
      animation: aurora-modal-in 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes aurora-modal-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .modal-box {
      background: rgba(20,20,40,0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 24px rgba(124,108,240,0.06);
      animation: aurora-modal-box-in 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes aurora-modal-box-in {
      from { opacity: 0; transform: scale(0.92) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-box h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
    .modal-box p  { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.25rem; line-height: 1.5; }
    .modal-box .fname { color: var(--text); font-weight: 500; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .modal-actions button {
      padding: 0.5rem 1.1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-actions button:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
    }

    .modal-actions .btn-danger {
      background: rgba(255,107,107,0.15);
      border-color: rgba(255,107,107,0.3);
      color: var(--danger);
    }

    .modal-actions .btn-danger:hover {
      background: rgba(255,107,107,0.25);
      border-color: rgba(255,107,107,0.5);
    }

    /* ========================================
       FLOATING VARIANT SWITCHER — GLASS PILL
       ======================================== */
    .variant-switcher {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16,16,32,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      z-index: 9998;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 16px rgba(124,108,240,0.05);
      user-select: none;
    }

    .variant-switcher button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .variant-switcher button:hover {
      background: var(--surface-hover);
      border-color: rgba(124,108,240,0.3);
      box-shadow: 0 0 12px rgba(124,108,240,0.1);
    }

    .variant-switcher .label {
      color: var(--text);
      font-weight: 600;
      min-width: 130px;
      text-align: center;
    }

    /* ========================================
       RESPONSIVE
       ======================================== */
    @media (max-width: 768px) {
      .app-header { padding: 0 0.75rem; gap: 0.5rem; }
      .search-box { width: 140px; }
      .sort-pills { display: none; }
      .stat { display: none; }
      .header-nav a span { display: none; }

      .variant-b { padding: 0.75rem; }
      .variant-b .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

      .variant-c { padding: 0.75rem; }

      .toast-container { right: 0.75rem; left: 0.75rem; }
      .toast { max-width: 100%; }

      .variant-switcher {
        bottom: 1rem;
        padding: 0.35rem 0.7rem;
        font-size: 0.78rem;
      }
      .variant-switcher .label { min-width: 100px; }
    }

    /* Touch devices: no hover, so always reveal actions */
    @media (hover: none) {
      .variant-a td.row-actions,
      .variant-b .file-card .card-actions,
      .variant-c .feed-item .feed-actions { opacity: 1; }
    }

    /* ========================================
       SCROLLBAR
       ======================================== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }

    [x-cloak] { display: none !important; }
  </style>
</head>
<body x-data="filesPage()" x-init="init()"
      @keydown.escape.window="confirmCancel()">

  <!-- AURORA BACKGROUND -->
  <div class="aurora-bg" aria-hidden="true">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
    <div class="aurora-blob blob-4"></div>
  </div>

  <!-- HEADER -->
  <header class="app-header">
    <a href="/" class="brand">HyperDrop</a>
    <nav class="header-nav">
      <a href="/" data-testid="nav-send" title="Upload files" aria-label="Send files">
        <svg stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
        <span>Send</span>
      </a>
      <a href="/files" class="active" data-testid="nav-files" title="Manage files" aria-label="Browse files">
        <svg stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
        <span>Files</span>
      </a>
    </nav>
    <div class="toolbar-spacer"></div>

    <!-- Sort pills -->
    <div class="sort-pills">
      <template x-for="pill in sortPills" :key="pill.key">
        <button class="sort-pill"
                :class="{ active: sortKey === pill.key }"
                @click="setSort(pill.key)"
                x-text="sortLabel(pill.key)"></button>
      </template>
    </div>

    <!-- Search -->
    <div class="search-box">
      <svg stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" placeholder="Search files..." x-model="searchQuery" aria-label="Search files">
    </div>

    <!-- Batch actions (visible only when files are selected) -->
    <div class="batch-bar" x-show="selectedCount > 0" x-cloak>
      <span class="batch-count" x-text="selectedCount + ' selected'"></span>
      <button class="batch-btn" @click="downloadSelected()" title="Download selected" aria-label="Download selected">
        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
      </button>
      <button class="batch-btn danger" data-testid="delete-selected" @click="deleteSelected()" title="Delete selected" aria-label="Delete selected">
        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
      </button>
    </div>

    <span class="stat"
          x-text="filtered.length + ' file' + (filtered.length !== 1 ? 's' : '') + ' · ' + formatSize(totalSize)"></span>
  </header>

  <!-- BREADCRUMB TRAIL -->
  <nav class="breadcrumb-bar" aria-label="Directory path">
    <template x-for="(crumb, i) in crumbs" :key="i">
      <span style="display:flex; align-items:center; gap:0.3rem;">
        <button class="crumb"
                :class="{ current: i === crumbs.length - 1 }"
                @click="navigateToSegment(i)"
                :aria-current="i === crumbs.length - 1 ? 'page' : 'false'"
                :title="i === 0 ? 'Root' : crumb.label">
          <template x-if="i === 0">
            <svg stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          </template>
          <template x-if="i !== 0">
            <span x-text="crumb.label"></span>
          </template>
        </button>
        <template x-if="i < crumbs.length - 1">
          <span class="crumb-sep" aria-hidden="true">›</span>
        </template>
      </span>
    </template>
  </nav>
  <div class="variant-a" x-show="variant === 'A'" x-cloak>
    <table>
      <thead>
        <tr>
          <th style="width:36px">
            <input type="checkbox" class="cb" x-ref="selectAll"
                   :checked="allSelected"
                   x-effect="if ($refs.selectAll) $refs.selectAll.indeterminate = someSelected"
                   @change="toggleAll($event.target.checked)"
                   aria-label="Select all">
          </th>
          <th>Name</th>
          <th>Size</th>
          <th>Received</th>
          <th>From</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <template x-if="filtered.length === 0">
          <tr class="empty-row"><td colspan="6">No files yet</td></tr>
        </template>
        <template x-for="f in filtered" :key="f.name">
          <tr data-testid="file-item" :class="{ selected: isSelected(f.name) }">
            <td>
              <input type="checkbox" class="cb"
                     :checked="isSelected(f.name)"
                     @change="toggleSelect(f.name)"
                     :aria-label="'Select ' + f.name">
            </td>
            <td>
              <div class="col-name">
                <span class="badge" :class="badgeClass(f)" x-text="badgeText(f)"></span>
                <span class="fname" data-testid="file-name"
                      :class="{ 'is-folder': f.is_dir }"
                      :title="f.is_dir ? 'Open ' + f.name : f.name"
                      @click="f.is_dir && navigateInto(f.name)"
                      x-text="f.name"></span>
              </div>
            </td>
            <td class="size" x-text="f.is_dir ? '—' : formatSize(f.size)"></td>
            <td class="date" x-text="relativeTime(f.date)"></td>
            <td class="from"><span class="from-dot"></span>this device</td>
            <td class="row-actions">
              <a class="act-btn" data-testid="play" target="_player" rel="noopener"
                 x-show="!f.is_dir && isPlayable(f)"
                 :href="'/player?file=' + encPath(f.name) + (qs ? '&' + qs.slice(1) : '')"
                 :aria-label="'Play ' + f.name" title="Play">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>
              </a>
              <a class="act-btn" data-testid="download" x-show="!f.is_dir"
                 :href="'/api/files/' + encPath(f.name) + qs"
                 download :aria-label="'Download ' + f.name"
                 title="Download">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
              </a>
              <button class="act-btn danger" data-testid="delete" @click="deleteOne(f)" :aria-label="'Delete ' + f.name" title="Delete">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
              </button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <!-- VARIANT B — GRID -->
  <div class="variant-b" x-show="variant === 'B'" x-cloak>
    <div class="grid">
      <template x-if="filtered.length === 0">
        <div class="empty-grid">No files yet</div>
      </template>
      <template x-for="f in filtered" :key="f.name">
        <div class="file-card" :class="{ selected: isSelected(f.name) }">
          <div class="preview" :class="badgeClass(f)">
            <span x-text="badgeText(f)"></span>
            <span class="from-tag">this device</span>
            <span class="cb-wrap">
              <input type="checkbox" class="cb"
                     :checked="isSelected(f.name)"
                     @change="toggleSelect(f.name)"
                     :aria-label="'Select ' + f.name">
            </span>
          </div>
          <div class="card-actions">
            <a data-testid="play" target="_player" rel="noopener"
               x-show="!f.is_dir && isPlayable(f)"
               :href="'/player?file=' + encPath(f.name) + (qs ? '&' + qs.slice(1) : '')"
               :aria-label="'Play ' + f.name" title="Play">
              <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>
            </a>
            <a x-show="!f.is_dir"
               :href="'/api/files/' + encPath(f.name) + qs"
               download :aria-label="'Download ' + f.name" title="Download">
              <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            </a>
            <button class="danger" @click="deleteOne(f)" :aria-label="'Delete ' + f.name" title="Delete">
              <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
            </button>
          </div>
          <div class="card-body">
            <div class="fname"
                 :class="{ 'is-folder': f.is_dir }"
                 :title="f.is_dir ? 'Open ' + f.name : f.name"
                 @click="f.is_dir && navigateInto(f.name)"
                 x-text="f.name"></div>
            <div class="meta">
              <span x-text="f.is_dir ? 'folder' : formatSize(f.size)"></span>
              <span x-text="relativeTime(f.date)"></span>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- VARIANT C — FEED -->
  <div class="variant-c" x-show="variant === 'C'" x-cloak>
    <template x-if="filtered.length === 0">
      <div class="empty-feed">No files yet</div>
    </template>
    <template x-for="group in feedGroups" :key="group.date">
      <div>
        <div class="date-divider"><span x-text="group.date"></span></div>
        <template x-for="f in group.items" :key="f.name">
          <div class="feed-item" :class="{ selected: isSelected(f.name) }">
            <div class="avatar">TD</div>
            <div class="feed-body">
              <div class="feed-header">
                <span class="sender">this device</span>
                <span class="feed-time" x-text="formatTimeShort(f.date)"></span>
              </div>
              <div class="file-chip">
                <div class="chip-icon" :class="badgeClass(f)" x-text="badgeText(f)"></div>
                <div class="chip-info">
                  <div class="chip-name"
                       :class="{ 'is-folder': f.is_dir }"
                       :title="f.is_dir ? 'Open ' + f.name : f.name"
                       @click="f.is_dir && navigateInto(f.name)"
                       x-text="f.name"></div>
                  <div class="chip-meta" x-text="f.is_dir ? 'folder' : formatSize(f.size)"></div>
                </div>
              </div>
            </div>
            <div class="feed-actions">
              <a class="act-btn" data-testid="play" target="_player" rel="noopener"
                 x-show="!f.is_dir && isPlayable(f)"
                 :href="'/player?file=' + encPath(f.name) + (qs ? '&' + qs.slice(1) : '')"
                 :aria-label="'Play ' + f.name" title="Play">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>
              </a>
              <a class="act-btn" x-show="!f.is_dir"
                 :href="'/api/files/' + encPath(f.name) + qs"
                 download :aria-label="'Download ' + f.name" title="Download">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
              </a>
              <button class="act-btn danger" @click="deleteOne(f)" :aria-label="'Delete ' + f.name" title="Delete">
                <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
              </button>
            </div>
          </div>
        </template>
      </div>
    </template>
  </div>

  <!-- CONFIRM MODAL -->
  <div class="modal-overlay" :class="{ open: confirmOpen }" role="dialog" aria-modal="true" @click.self="confirmCancel()">
    <div class="modal-box">
      <h3 x-text="confirmTitle"></h3>
      <p x-html="confirmBody"></p>
      <div class="modal-actions">
        <button @click="confirmCancel()">Cancel</button>
        <button class="btn-danger" @click="confirmOk()" x-text="confirmOkLabel"></button>
      </div>
    </div>
  </div>

  <!-- TOASTS -->
  <div class="toast-container" data-testid="toasts" aria-live="polite">
    <template x-for="t in toasts" :key="t.id">
      <div class="toast" :class="t.type" x-text="t.msg"></div>
    </template>
  </div>

  <!-- VARIANT SWITCHER -->
  <div class="variant-switcher" role="navigation" aria-label="Layout variant switcher">
    <button @click="prevVariant()" title="Previous variant" aria-label="Previous variant">&#8592;</button>
    <div class="label" x-text="switcherLabel"></div>
    <button @click="nextVariant()" title="Next variant" aria-label="Next variant">&#8594;</button>
  </div>

  <script>
    function filesPage() {
      const VARIANTS = [
        { key: 'A', name: 'Table' },
        { key: 'B', name: 'Grid' },
        { key: 'C', name: 'Feed' },
      ];
      // Natively <video>-decodable containers — mirrors server.playable().
      const PLAYABLE_EXTS = ['.mp4', '.m4v', '.webm', '.ogv', '.mov'];

      return {
        files: [],
        variant: 'A',
        currentPath: '',       // active sub-directory relative to root ('' = root)
        token: '',
        sortKey: 'date',
        sortDir: -1,           // -1 = newest/name-z/largest first; +1 reversed
        sortPills: [
          { key: 'date' },
          { key: 'name' },
          { key: 'size' },
        ],
        searchQuery: '',
        selected: {},          // name -> true
        toasts: [],
        nextToastId: 0,
        ws: null,              // live WebSocket connection (issue 10)
        wsReconnectDelay: 1000, // exp-backoff base for WS reconnect
        confirmOpen: false,
        confirmTitle: '',
        confirmBody: '',
        confirmOkLabel: 'Delete',
        _confirmResolve: null,

        init() {
          const params = new URLSearchParams(location.search);
          const v = (params.get('variant') || 'A').toUpperCase();
          if (VARIANTS.some(x => x.key === v)) this.variant = v;
          this.token = params.get('token') || '';
          this.currentPath = (params.get('path') || '').replace(/^\/+|\/+$/g, '');

          // The server sets the hyperdrop_session cookie on the token-bearing
          // page request; from here on the cookie — not the URL — is the
          // credential. Drop ?token from the address bar so it doesn't linger
          // in browser history or leak via Referer. this.token stays in memory
          // so API calls keep working until the cookie round-trips.
          // NOTE: history.replaceState is not exercised by the Go HTTP tests;
          // manually verified, regression coverage pending E2E (#20/#21).
          this.stripTokenFromURL();

          const onKey = (e) => {
            const tag = document.activeElement && document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA') return;
            if (e.key === 'ArrowLeft') { e.preventDefault(); this.prevVariant(); }
            if (e.key === 'ArrowRight') { e.preventDefault(); this.nextVariant(); }
          };
          document.addEventListener('keydown', onKey);

          this.load();
          this.connectWS();
        },

        // Open the real-time event stream. Reconnects with exponential backoff
        // when the socket drops, so all browsers stay in sync without a refresh.
        connectWS() {
          const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
          const url = proto + '//' + location.host + '/api/ws' + this.qs;
          let ws;
          try {
            ws = new WebSocket(url);
          } catch (e) {
            this.scheduleReconnect();
            return;
          }
          this.ws = ws;

          ws.onmessage = (ev) => {
            let data;
            try { data = JSON.parse(ev.data); } catch (e) { return; }
            if (data.type === 'file_uploaded') {
              this.onRemoteUpload(data.file || {}, data.path);
            } else if (data.type === 'file_deleted') {
              this.onRemoteDelete(data.name, data.path);
            }
          };

          ws.onclose = () => { this.ws = null; this.scheduleReconnect(); };
          ws.onerror = () => { try { ws.close(); } catch (e) {} };
        },

        // Backoff capped at ~16s; reset whenever a fresh connection is opened.
        scheduleReconnect() {
          const delay = this.wsReconnectDelay;
          this.wsReconnectDelay = Math.min(delay * 2, 16000);
          setTimeout(() => this.connectWS(), delay);
        },

        // A remote device uploaded a file. Only apply it to the open view when
        // the event's directory matches currentPath; an event you receive is
        // otherwise guaranteed to describe a folder you are not looking at.
        onRemoteUpload(file, path) {
          if (!file || !file.name) return;
          if (path !== this.currentPath) return;
          if (this.files.some((f) => f.name === file.name)) return;
          this.files.push({
            name: file.name,
            size: file.size || 0,
            date: new Date(),
            is_dir: false,
            category: file.category || 'file',
            ext: this.extOf(file.name),
          });
          this.toast(file.name + ' received from another device', 'info');
        },

        onRemoteDelete(name, path) {
          if (!name) return;
          if (path !== this.currentPath) return;
          this.files = this.files.filter((f) => f.name !== name);
          delete this.selected[name];
        },

        // Query string carrying token + path + variant, so every API call and
        // shareable URL stays consistent with the current directory.
        get qs() {
          const p = new URLSearchParams();
          if (this.token) p.set('token', this.token);
          if (this.variant) p.set('variant', this.variant);
          if (this.currentPath) p.set('path', this.currentPath);
          const s = p.toString();
          return s ? ('?' + s) : '';
        },

        // Resolve a name relative to the current directory.
        fullPath(name) {
          return this.currentPath ? (this.currentPath + '/' + name) : name;
        },

        // URL-encode a relative path segment-by-segment (keeps / as separator).
        encPath(name) {
          return this.fullPath(name).split('/').map(encodeURIComponent).join('/');
        },

        // Breadcrumb segments: index 0 = Home (root), then one per path part.
        get crumbs() {
          const segs = [{ label: 'Home', path: '' }];
          if (this.currentPath) {
            const parts = this.currentPath.split('/').filter(Boolean);
            let acc = '';
            for (const part of parts) {
              acc = acc ? (acc + '/' + part) : part;
              segs.push({ label: part, path: acc });
            }
          }
          return segs;
        },

        navigateInto(name) {
          this.selected = {};
          this.currentPath = this.fullPath(name);
          this.updateURL();
          window.scrollTo(0, 0);
          this.load();
        },

        navigateToSegment(i) {
          const target = this.crumbs[i];
          if (!target || target.path === this.currentPath) return;
          this.selected = {};
          this.currentPath = target.path;
          this.updateURL();
          window.scrollTo(0, 0);
          this.load();
        },

        updateURL() {
          // Rebuild the address bar from current state, but omit the token:
          // the cookie is the persistent credential, so the token must not
          // re-enter the URL on folder/variant navigation (history/Referer).
          const p = new URLSearchParams();
          if (this.variant) p.set('variant', this.variant);
          if (this.currentPath) p.set('path', this.currentPath);
          const s = p.toString();
          const url = location.pathname + (s ? ('?' + s) : '');
          try { history.replaceState(null, '', url); } catch (e) { /* non-secure ctx */ }
        },

        // Remove ?token from the address bar without disturbing other params
        // (variant/path). Called once on init after the server has set the
        // session cookie. this.token is retained in memory so qs keeps
        // authenticating API calls until the cookie round-trips.
        stripTokenFromURL() {
          try {
            const u = new URL(location.href);
            if (!u.searchParams.has('token')) return;
            u.searchParams.delete('token');
            history.replaceState(null, '', u.pathname + u.search + u.hash);
          } catch (e) { /* non-secure context or no history API */ }
        },

        // ---- data ----
        async load() {
          try {
            const resp = await fetch('/api/files' + this.qs);
            if (!resp.ok) { this.toast('failed to load files (' + resp.status + ')', 'error'); return; }
            const data = await resp.json();
            this.files = (data || []).map((e) => ({
              name: e.name,
              size: e.size,
              date: new Date(e.mod_time),
              is_dir: !!e.is_dir,
              category: e.category,
              ext: this.extOf(e.name),
            }));
          } catch (err) {
            this.toast('failed to load files', 'error');
          }
        },

        extOf(name) {
          const parts = String(name).split('.');
          return parts.length > 1 ? parts.pop().toLowerCase() : '';
        },

        badgeClass(f) {
          return f.is_dir ? 'file' : (f.category || 'file');
        },

        badgeText(f) {
          if (f.is_dir) return 'DIR';
          return f.ext || 'FILE';
        },

        // Natively <video>-decodable containers only — mirrors server.playable().
        // Non-playable vid files (mkv/avi/flv/wmv) keep the Download button but
        // get no Play action.
        isPlayable(f) {
          if (f.is_dir || (f.category || 'file') !== 'vid') return false;
          const i = f.name.lastIndexOf('.');
          if (i < 0) return false;
          return PLAYABLE_EXTS.includes(f.name.slice(i).toLowerCase());
        },

        // ---- derived views ----
        get filtered() {
          let list = this.files;
          const q = this.searchQuery.trim().toLowerCase();
          if (q) {
            list = list.filter((f) =>
              f.name.toLowerCase().includes(q) ||
              f.ext.toLowerCase().includes(q)
            );
          }
          const dir = this.sortDir;
          return [...list].sort((a, b) => {
            if (this.sortKey === 'name') return dir * a.name.localeCompare(b.name);
            if (this.sortKey === 'size') return dir * (a.size - b.size);
            return dir * (a.date - b.date);   // 'date'
          });
        },

        get totalSize() {
          return this.filtered.reduce((s, f) => s + (f.is_dir ? 0 : f.size), 0);
        },

        get feedGroups() {
          const groups = [];
          const idx = {};
          for (const f of this.filtered) {
            const key = this.formatDate(f.date);
            if (!idx[key]) { idx[key] = groups.length; groups.push({ date: key, items: [] }); }
            groups[idx[key]].items.push(f);
          }
          return groups;
        },

        get selectedCount() {
          return Object.keys(this.selected).length;
        },

        get selectedNames() {
          return Object.keys(this.selected);
        },

        get allSelected() {
          return this.filtered.length > 0 && this.filtered.every((f) => this.selected[f.name]);
        },

        get someSelected() {
          return this.filtered.some((f) => this.selected[f.name]) && !this.allSelected;
        },

        get switcherLabel() {
          const v = VARIANTS.find((x) => x.key === this.variant);
          return v ? (v.key + ' — ' + v.name) : '';
        },

        // ---- selection ----
        isSelected(name) { return !!this.selected[name]; },

        toggleSelect(name) {
          if (this.selected[name]) { const c = { ...this.selected }; delete c[name]; this.selected = c; }
          else { this.selected = { ...this.selected, [name]: true }; }
        },

        toggleAll(checked) {
          if (checked) {
            const next = {};
            this.filtered.forEach((f) => { next[f.name] = true; });
            this.selected = next;
          } else {
            this.selected = {};
          }
        },

        // ---- sort ----
        setSort(key) {
          if (this.sortKey === key) this.sortDir *= -1;
          else { this.sortKey = key; this.sortDir = -1; }
        },

        sortLabel(key) {
          const labels = { date: 'Newest', name: 'Name', size: 'Size' };
          if (key !== this.sortKey) return labels[key];
          if (this.sortDir === -1) return key === 'date' ? 'Newest' : labels[key];
          return key === 'date' ? 'Oldest' : (labels[key] + ' ↑');
        },

        // ---- variant switcher ----
        prevVariant() {
          const i = VARIANTS.findIndex((v) => v.key === this.variant);
          this.variant = VARIANTS[(i - 1 + VARIANTS.length) % VARIANTS.length].key;
        },

        nextVariant() {
          const i = VARIANTS.findIndex((v) => v.key === this.variant);
          this.variant = VARIANTS[(i + 1) % VARIANTS.length].key;
        },

        // ---- actions ----
        async deleteOne(f) {
          const ok = await this.confirm(
            'Delete ' + (f.is_dir ? 'folder' : 'file') + '?',
            'Delete <span class="fname">' + this.escape(f.name) + '</span>? This cannot be undone.'
          );
          if (!ok) return;
          const ok2 = await this._deleteName(f.name);
          if (ok2) { this.toast(f.name + ' deleted', 'success'); await this.load(); }
        },

        async deleteSelected() {
          const targets = this.selectedNames.slice();
          if (!targets.length) return;
          const ok = await this.confirm(
            'Delete ' + targets.length + ' item' + (targets.length > 1 ? 's' : '') + '?',
            'Delete <span class="fname">' + targets.length + ' selected item' + (targets.length > 1 ? 's' : '') + '</span>? This cannot be undone.'
          );
          if (!ok) return;
          let failures = 0;
          for (const name of targets) {
            const ok2 = await this._deleteName(name);
            if (!ok2) failures++;
          }
          this.selected = {};
          await this.load();
          if (failures === 0) this.toast(targets.length + ' item' + (targets.length > 1 ? 's' : '') + ' deleted', 'success');
          else this.toast(failures + ' delete(s) failed', 'error');
        },

        async _deleteName(name) {
          try {
            const resp = await fetch('/api/files/' + this.encPath(name) + this.qs, { method: 'DELETE' });
            return resp.ok;
          } catch (err) {
            return false;
          }
        },

        downloadSelected() {
          const targets = this.filtered.filter((f) => !f.is_dir && this.selected[f.name]);
          if (!targets.length) {
            this.toast('no downloadable files selected', 'info');
            return;
          }
          // Browsers gate multi-download behind a user gesture + may block rapid
          // popups. Stagger the triggers so most land; nothing fatal if some don't.
          targets.forEach((f, i) => {
            setTimeout(() => {
              window.location.href = '/api/files/' + this.encPath(f.name) + this.qs;
            }, i * 400);
          });
          this.toast('downloading ' + targets.length + ' file' + (targets.length > 1 ? 's' : ''), 'info');
        },

        // ---- formatters ----
        formatSize(bytes) {
          if (bytes < 1024) return bytes + ' B';
          if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
          if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
          return (bytes / 1073741824).toFixed(2) + ' GB';
        },

        relativeTime(date) {
          const now = new Date();
          const diff = now - date;
          const mins = Math.floor(diff / 60000);
          const hours = Math.floor(mins / 60);
          const days = Math.floor(hours / 24);
          if (isNaN(diff)) return '';
          if (mins < 1) return 'just now';
          if (mins < 60) return mins + 'm ago';
          if (hours < 24) return hours + 'h ago';
          if (days === 1) return 'yesterday';
          return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        },

        formatDate(date) {
          return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        },

        formatTimeShort(date) {
          return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        },

        // ---- toast ----
        toast(msg, type) {
          const id = ++this.nextToastId;
          this.toasts.push({ id, msg, type: type || 'info' });
          setTimeout(() => {
            this.toasts = this.toasts.filter((t) => t.id !== id);
          }, 2500);
        },

        // ---- confirm modal ----
        confirm(title, body, okLabel) {
          return new Promise((resolve) => {
            this.confirmTitle = title;
            this.confirmBody = body;
            this.confirmOkLabel = okLabel || 'Delete';
            this.confirmOpen = true;
            this._confirmResolve = resolve;
          });
        },
        confirmOk() {
          this.confirmOpen = false;
          if (this._confirmResolve) { this._confirmResolve(true); this._confirmResolve = null; }
        },
        confirmCancel() {
          this.confirmOpen = false;
          if (this._confirmResolve) { this._confirmResolve(false); this._confirmResolve = null; }
        },

        // ---- helpers ----
        escape(s) {
          return String(s).replace(/[&<>"']/g, (c) => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
          ));
        },
      };
    }
  </script>
</body>
</html>
