<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperDrop — Shared file</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
  <!-- Server-injected, html-safe JSON (encoding/json escapes <,>,&). Read by
       sharePage() below. __SHARE_DATA__ is replaced before the body is sent. -->
  <script>window.__SHARE__ = __SHARE_DATA__;</script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080b1a;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.08);
      --text: #e8e8f8;
      --text-muted: #7878a0;
      --accent: #7c6cf0;
      --gradient-accent: linear-gradient(135deg, #7c6cf0, #4ecdc4);
      --radius: 16px;
      --radius-sm: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; overflow-x: hidden; position: relative;
    }
    .mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace; }

    .aurora-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .aurora-blob { position: absolute; border-radius: 50%; filter: blur(120px); }
    .aurora-blob.b1 { width: 600px; height: 600px; background: rgba(124,108,240,0.15); top: -10%; left: -5%; }
    .aurora-blob.b2 { width: 500px; height: 500px; background: rgba(78,205,196,0.10); bottom: -10%; right: -8%; }

    /* Stripped header: brand only, no nav (recipients can't reach Send/Files). */
    .app-header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0 1.5rem; height: 56px;
      background: rgba(8,11,26,0.7);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .app-header .brand {
      font-size: 1.2rem; font-weight: 800; letter-spacing: -0.03em;
      background: var(--gradient-accent);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      text-decoration: none;
    }
    .share-pill {
      margin-left: auto; font-size: 0.72rem; color: var(--text-muted);
      border: 1px solid var(--border); border-radius: 999px; padding: 0.25rem 0.7rem;
    }

    main { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    .player-card {
      background: var(--surface);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    }
    .player-video { display: block; width: 100%; max-height: 74vh; background: #000; }
    .player-meta {
      display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
      padding: 1rem 1.25rem; border-top: 1px solid var(--border);
    }
    .player-title { font-weight: 600; font-size: 1rem; word-break: break-all; }
    .player-actions { margin-left: auto; display: flex; gap: 0.5rem; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 0.9rem; border-radius: var(--radius-sm);
      font-size: 0.85rem; font-weight: 600; text-decoration: none;
      color: #fff; background: var(--gradient-accent);
      border: 1px solid transparent; transition: all 0.2s ease;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }

    .download-card { padding: 2.5rem 2rem; text-align: center; }
    .download-card .icon {
      width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(124,108,240,0.18); color: var(--accent);
    }
    .download-card .icon svg { width: 28px; height: 28px; stroke: currentColor; fill: none; }
    .download-card h2 { font-size: 1.05rem; margin-bottom: 0.4rem; word-break: break-all; }
    .download-card p { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.25rem; }

    [x-cloak] { display: none !important; }
  </style>
</head>
<body x-data="sharePage()">

  <div class="aurora-bg" aria-hidden="true">
    <div class="aurora-blob b1"></div>
    <div class="aurora-blob b2"></div>
  </div>

  <header class="app-header">
    <a href="/" class="brand">HyperDrop</a>
    <span class="share-pill">Shared with you</span>
  </header>

  <!-- Playable video -->
  <main x-show="playable" x-cloak>
    <div class="player-card">
      <video class="player-video" controls playsinline preload="metadata"
             data-testid="share-video"
             :src="'/api/stream/' + encPath"
             @error="playFailed = true"></video>
      <div class="player-meta">
        <span class="player-title" data-testid="share-title" x-text="name"></span>
        <div class="player-actions">
          <a class="btn" data-testid="share-download"
             :href="'/api/files/' + encPath" :download="name"
             title="Download">
            <svg stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            Download
          </a>
        </div>
      </div>
    </div>
    <p class="mono" x-show="playFailed" x-cloak style="margin-top:1rem;color:var(--text-muted);font-size:.85rem">
      This video can't play in your browser. Use Download instead.
    </p>
  </main>

  <!-- Non-playable / generic file -->
  <main x-show="!playable" x-cloak>
    <div class="player-card">
      <div class="download-card">
        <div class="icon">
          <svg stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        </div>
        <h2 data-testid="share-title" x-text="name"></h2>
        <p>This file can't be previewed in-browser — download it to open.</p>
        <a class="btn" data-testid="share-download"
           :href="'/api/files/' + encPath" :download="name">Download</a>
      </div>
    </div>
  </main>

  <script>
    function sharePage() {
      const d = window.__SHARE__ || {};
      return {
        name: d.name || 'file',
        encPath: d.encPath || '',
        playable: !!d.playable,
        playFailed: false,
      };
    }
  </script>
</body>
</html>
