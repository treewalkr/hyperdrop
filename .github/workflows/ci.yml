name: ci

# Continuous integration: format, vet, build, and test on every push to main
# and every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then
            echo "::error::Go files are not gofmt-formatted:"
            echo "$out"
            gofmt -d cmd internal
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...
