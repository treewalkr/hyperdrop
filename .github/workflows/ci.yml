name: ci

# Continuous integration: format, vet, build, and test on every push to main
# and every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then
            echo "::error::Go files are not gofmt-formatted:"
            echo "$out"
            gofmt -d cmd internal
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    # Browser E2E is decoupled from the Go checks so flakiness here never gates
    # fmt/vet/build/test. Drives the real binary built in the step below.
    # Hard stop so a wedged webServer that never boots fails fast instead of
    # running to the runner limit.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        # setup-bun owns Bun dependency caching (setup-node can't cache 'bun').
        uses: oven-sh/setup-bun@v2
        with:
          cache: e2e/bun.lock

      - name: Build binary
        run: go build -o hyperdrop ./cmd/hyperdrop

      - name: Install E2E deps
        working-directory: e2e
        run: bun install --frozen-lockfile

      - name: Toolchain rule check
        working-directory: e2e
        run: bun run check

      - name: Cache Playwright browser
        # Cache the Chromium download so a flaky/slow browser-host fetch does
        # not block PRs or eat the per-job wall clock. Keyed on the lockfile so
        # a Playwright bump invalidates it.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          # Pre-built binary: the launch script skips its in-script `go build`.
          E2E_BIN: ${{ github.workspace }}/hyperdrop
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
