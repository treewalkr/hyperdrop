name: ci

# Continuous integration: format, vet, build, and test on every push to main
# and every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then
            echo "::error::Go files are not gofmt-formatted:"
            echo "$out"
            gofmt -d cmd internal
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    # Browser E2E is decoupled from the Go checks so flakiness here never gates
    # fmt/vet/build/test. Drives the real binary built in the step below.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'bun'
          cache-dependency-path: e2e/bun.lock

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build binary
        run: go build -o hyperdrop ./cmd/hyperdrop

      - name: Install E2E deps
        working-directory: e2e
        run: bun install --frozen-lockfile

      - name: Toolchain rule check
        working-directory: e2e
        run: bun run check

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          # Pre-built binary: the launch script skips its in-script `go build`.
          E2E_BIN: ${{ github.workspace }}/hyperdrop
        run: npx playwright test
